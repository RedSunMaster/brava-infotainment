<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
		<title>Brava Infotainment</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html,
			body,
			#root {
				height: 100%;
				width: 100%;
				overflow: hidden;
			}
			body {
				margin: 0;
				padding: 0;
				background: #060a14;
			}
			/* The opening screen: the same picture the boot splash (deploy/boot) shows, in the same place, so the hand-over cannot be seen. */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #060a14;
				transition: opacity 1s ease;
			}
			#splash.done {
				opacity: 0;
				pointer-events: none;
			}
			#splash svg {
				width: calc(min(100vw, 100vh) * 0.9);
				height: auto;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>

		<!-- brand:end -->
		<script>
			// Tells the app that the opening screen is on the display, so the early boot splash underneath it can go.
			requestAnimationFrame(() => requestAnimationFrame(() => { try { require("electron").ipcRenderer.send("splash-shown"); } catch (e) { /* Not in Electron. */ } }));
		</script>
	</body>
</html>
