# Copy to ~/.config/spotifyd/spotifyd.conf on the car computer.
[global]
# The app finds the player by this name. Change SPOTIFY_DEVICE_NAME in .env if you change it.
device_name = "Brava"
device_type = "computer"

# "pulseaudio" also covers PipeWire. Use "alsa" if the car has no sound server.
backend = "pulseaudio"
bitrate = 320
volume_controller = "softvol"
initial_volume = "40"

# Signs in through Spotify Connect (see SPOTIFY_PLAYER.md), then remembers it here.
zeroconf_port = 5354
cache_path = "~/.cache/spotifyd"

use_mpris = false
