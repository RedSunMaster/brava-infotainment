# The phone is only linked for notifications (brava-phone-bridge, over its own Bluetooth channel). Its audio must not reach
# the car: audio goes out through the car's own output or a separate Bluetooth speaker.
# Install as ~/.config/wireplumber/wireplumber.conf.d/51-brava-no-phone-audio.conf, then:
#   systemctl --user restart wireplumber
# Replace the address below with the phone's (bluetoothctl devices): upper case, underscores instead of colons.
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.08_8B_C8_5D_68_8A" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
