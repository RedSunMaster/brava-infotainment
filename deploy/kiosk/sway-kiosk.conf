# Brava kiosk: a bare Wayland compositor (sway) that shows only the app. Used instead of GNOME when the car is started
# with systemd.unit=brava-kiosk.target (see test-boot.sh). Nothing here touches the normal GNOME session.

# The panel is a 1920x1080 landscape screen mounted in portrait. GNOME stores the same thing as `rotation: right`.
# If the picture comes up sideways or upside down, change 90 to 270 (or 180) and restart brava-kiosk.service.
output DP-1 {
    mode 1920x1080@60Hz
    transform 90
    bg /home/brava/.local/share/brava/splash.png fit #0a0705
}

# Touch: map the touchscreen to the panel. sway rotates touch itself to match `transform 90`, so the identity matrix below
# cancels the rotation matrix in /etc/udev/rules.d/99-touchscreen-rotate.rules (needed for GNOME). Without this the
# rotation is applied twice: tested on the car, top-left registered at bottom-left and top-right at top-left.
input type:touch {
    map_to_output DP-1
    calibration_matrix 1 0 0 0 1 0
}

seat * hide_cursor 1
focus_follows_mouse no
default_border none
default_floating_border none
titlebar_border_thickness 0
hide_edge_borders both
font pango:monospace 1

# The Spotify sign-in is a second Electron window. Show it centred over the app instead of tiling it beside it.
for_window [title="Connect Spotify"] floating enable, resize set 500 750, move position center

# Test escape hatch for a physical keyboard: Ctrl+Alt+Shift+Q quits sway (the service does not restart it after a clean exit).
bindsym ctrl+alt+shift+q exit

exec /home/brava/.local/bin/brava-kiosk-app
